<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HACKER TYCOON V3</title><style>@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');*{margin:0;padding:0;box-sizing:border-box;font-family:'JetBrains Mono',monospace}body{background:#000;color:#00ff41;overflow-x:hidden;min-height:100vh}#matrix{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;opacity:0.15}.top{position:sticky;top:0;background:rgba(0,0,0,0.9);border-bottom:1px solid #00ff41;padding:10px;z-index:10}.cash{font-size:26px;font-weight:700}.sub{font-size:11px;color:#00aa2a;display:flex;gap:12px;flex-wrap:wrap;margin-top:4px}.bar-wrap{height:6px;background:#111;border:1px solid #003b00;margin-top:8px}.bar{height:100%;transition:width.3s}.bar.trace{background:linear-gradient(90deg,#ff0033,#ff6600)}.center{display:flex;flex-direction:column;align-items:center;padding:20px 15px}.hack-btn{width:180px;height:180px;border-radius:50%;border:3px solid #00ff41;background:radial-gradient(circle,#001a00,#000);color:#00ff41;font-size:22px;font-weight:700;cursor:pointer;box-shadow:0 0 30px rgba(0,255,65,0.4)}.hack-btn:active{transform:scale(0.92)}.combo{margin-top:12px;font-size:18px;height:24px;color:#aaff00}.overclock{margin-top:14px;padding:12px 24px;background:#000;border:2px solid #00ff41;color:#00ff41;font-weight:700;cursor:pointer}.overclock.active{background:#00ff41;color:#000;box-shadow:0 0 20px #00ff41}.overclock.cool{opacity:.5}.vuln{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);background:#ffcc00;color:#000;padding:18px 28px;border:3px solid #000;font-weight:800;font-size:18px;z-index:100;display:none;cursor:pointer;box-shadow:0 0 40px #ffcc00}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#000;border-top:1px solid #00ff41;z-index:20}.tab{flex:1;padding:14px;text-align:center;font-size:12px;cursor:pointer}.tab.active{background:#00ff41;color:#000;font-weight:700}.panel{padding:15px;padding-bottom:80px;max-width:600px;margin:0 auto;width:100%}.card{background:rgba(0,255,65,0.05);border:1px solid rgba(0,255,65,0.3);padding:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}.card button{background:#00ff41;color:#000;border:none;padding:8px 14px;font-weight:700;cursor:pointer}.card button:disabled{background:#222;color:#555}.log{font-size:10px;color:#00aa2a;height:80px;overflow:hidden;background:#000;border-top:1px solid #111;padding:6px;margin-top:10px}.float{position:absolute;color:#00ff41;font-weight:700;pointer-events:none;animation:floatUp.8s forwards}@keyframes floatUp{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-60px);opacity:0}}.rank{color:#aaff00}</style></head><body><canvas id="matrix"></canvas><div class="top"><div class="cash" id="cash">$0</div><div class="sub"><span id="cps">0/s</span><span>TRACE: <span id="trace">0%</span></span><span>REP: <span id="rep">0</span></span><span class="rank" id="rank"></span><span style="color:#ffcc00" id="potential"></span></div><div class="bar-wrap"><div class="bar trace" id="traceBar" style="width:0%"></div></div></div><div class="center"><button class="hack-btn" id="hackBtn">HACK</button><div class="combo" id="combo"></div><button class="overclock" id="ocBtn">OVERCLOCK READY [5x]</button><div style="margin-top:12px;display:flex;gap:8px"><button onclick="cleanLogs()" style="background:#111;border:1px solid #f60;color:#f60;padding:6px 10px;font-size:11px">CLEAN -$10k</button><button onclick="doRaid()" style="background:#f03;border:1px solid #f03;color:#fff;padding:6px 12px;font-size:11px">FBI RAID</button></div></div><div class="panel" id="panel"></div><div class="log" id="log"></div><div class="tabs"><div class="tab active" onclick="setTab('rigs')">RIGS</div><div class="tab" onclick="setTab('contracts')">CONTRACTS</div><div class="tab" onclick="setTab('upgrades')">UPGRADES</div></div><div class="vuln" id="vuln" onclick="hitVuln()">[BUG] VULN FOUND! TAP!</div><script>const canvas=document.getElementById('matrix'),ctx=canvas.getContext('2d');function resize(){canvas.width=innerWidth;canvas.height=innerHeight}resize();const drops=[];for(let i=0;i<100;i++)drops[i]=Math.random()*innerHeight;function drawMatrix(){ctx.fillStyle='rgba(0,0,0,0.05)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#00ff41';ctx.font='12px monospace';drops.forEach((y,i)=>{ctx.fillText(Math.random()>0.5?'1':'0',i*14,y);if(y>canvas.height&&Math.random()>0.975)drops[i]=0;drops[i]+=14});requestAnimationFrame(drawMatrix)}drawMatrix();let state={cash:0,lifetime:0,rep:0,trace:0,clickPower:1,combo:0,lastClick:0,comboTimer:null,cps:0,overclockActive:false,overclockCd:0,boostTime:0,rigs:[{name:'Skid Laptop',cost:15,baseCost:15,prod:0.2,count:0},{name:'Phishing Kit',cost:150,baseCost:150,prod:1.5,count:0},{name:'Botnet Node',cost:2000,baseCost:2000,prod:12,count:0},{name:'Zero-Day',cost:25000,baseCost:25000,prod:110,count:0},{name:'Quantum Rig',cost:300000,baseCost:300000,prod:900,count:0}],upgrades:[{name:'Better Scripts',desc:'Click x3',cost:500,bought:false,mult:3},{name:'Proxy Chain',desc:'Global x2.5',cost:5000,bought:false,mult:2.5},{name:'AI Assistant',desc:'Rigs x2',cost:50000,bought:false,mult:2}],contracts:[{type:'clicks',target:50,progress:0,reward:500},{type:'cash',target:5000,progress:0,reward:2000},{type:'rigs',target:5,progress:0,reward:5000}],tab:'rigs'};function load(){const s=localStorage.getItem('hackerV3');if(s){const p=JSON.parse(s);state.cash=p.cash||0;state.lifetime=p.lifetime||0;state.rep=p.rep||0;state.trace=p.trace||0;state.rigs=p.rigs||state.rigs;state.upgrades=p.upgrades||state.upgrades;state.contracts=p.contracts||state.contracts;state.clickPower=p.clickPower||1;if(p.lastSave){const diff=(Date.now()-p.lastSave)/1000;const cpsCalc=getCPS()*diff*0.5;state.cash+=cpsCalc;state.lifetime+=cpsCalc}}}function save(){state.lastSave=Date.now();localStorage.setItem('hackerV3',JSON.stringify(state))}function format(n){if(n<1000)return Math.floor(n)+'';if(n<1e6)return(n/1000).toFixed(1)+'K';if(n<1e9)return(n/1e6).toFixed(2)+'M';return(n/1e9).toFixed(2)+'B'}function getCPS(){let b=0;state.rigs.forEach(r=>b+=r.count*r.prod);let m=1+state.rep*0.15;if(state.upgrades[1].bought)m*=2.5;if(state.upgrades[2].bought)m*=2;if(state.overclockActive)m*=5;if(state.boostTime>0)m*=2;return b*m}function getClick(){let c=state.clickPower;if(state.upgrades[0].bought)c*=3;c*=1+state.rep*0.15;let cm=1+state.combo*0.4;if(cm>3)cm=3;if(state.overclockActive)cm*=5;if(state.boostTime>0)cm*=2;return c*cm}function log(t){const el=document.getElementById('log');const d=document.createElement('div');d.textContent='> '+t;el.prepend(d);if(el.children.length>20)el.lastChild.remove()}document.getElementById('hackBtn').addEventListener('touchstart',e=>{e.preventDefault();doHack()});document.getElementById('hackBtn').addEventListener('mousedown',doHack);function doHack(){const now=Date.now();if(now-state.lastClick<1500){state.combo++;if(state.combo>10)state.combo=10}else state.combo=0;state.lastClick=now;clearTimeout(state.comboTimer);state.comboTimer=setTimeout(()=>{state.combo=0;updateUI()},1500);const g=getClick();state.cash+=g;state.lifetime+=g;state.trace+=0.08;if(state.trace>100)state.trace=100;state.contracts.forEach(c=>{if(c.type==='clicks')c.progress++;if(c.type==='cash')c.progress=state.lifetime;if(c.type==='rigs')c.progress=state.rigs.reduce((a,r)=>a+r.count,0)});spawnFloat(g);updateUI()}function spawnFloat(v){const el=document.createElement('div');el.className='float';el.textContent='+ $'+format(v);const r=document.getElementById('hackBtn').getBoundingClientRect();el.style.left=(r.left+r.width/2+Math.random()*60-30)+'px';el.style.top=(r.top+20)+'px';document.body.appendChild(el);setTimeout(()=>el.remove(),800)}function buyRig(i){const r=state.rigs[i];if(state.cash>=r.cost){state.cash-=r.cost;r.count++;r.cost=Math.floor(r.baseCost*Math.pow(1.25,r.count));state.trace+=0.6;log('bought '+r.name);updateUI()}}function buyUp(i){const u=state.upgrades[i];if(!u.bought&&state.cash>=u.cost){state.cash-=u.cost;u.bought=true;log('upgrade '+u.name);updateUI()}}function cleanLogs(){if(state.cash>=10000&&state.trace>0){state.cash-=10000;state.trace-=50;if(state.trace<0)state.trace=0;log('logs cleaned');updateUI()}}function doRaid(){const pot=Math.floor(Math.sqrt(state.lifetime/1e6));if(pot<=0)return alert('Need $1M lifetime');if(!confirm(`RAID? +${pot} REP (+${pot*15}% forever)`))return;state.rep+=pot;state.cash=0;state.trace=0;state.rigs.forEach(r=>{r.count=0;r.cost=r.baseCost});state.upgrades.forEach(u=>u.bought=false);state.combo=0;state.boostTime=0;state.overclockActive=false;state.overclockCd=0;state.contracts=[{type:'clicks',target:50,progress:0,reward:500},{type:'cash',target:5000,progress:0,reward:2000},{type:'rigs',target:5,progress:0,reward:5000}];log('RAID +'+pot+' REP');updateUI()}function setTab(t){state.tab=t;document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',['rigs','contracts','upgrades'][i]===t));render()}function render(){const p=document.getElementById('panel');p.innerHTML='';if(state.tab==='rigs'){state.rigs.forEach((r,i)=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<div><b>${r.name}</b> x${r.count}<br><span style="font-size:11px">${r.prod}/s • ${format(r.prod*r.count)}/s</span></div><button ${state.cash<r.cost?'disabled':''} onclick="buyRig(${i})">$${format(r.cost)}</button>`;p.appendChild(d)})}if(state.tab==='upgrades'){state.upgrades.forEach((u,i)=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<div><b>${u.name}</b> ${u.bought?'[OWNED]':''}<br><span style="font-size:11px">${u.desc} - $${format(u.cost)}</span></div><button ${u.bought||state.cash<u.cost?'disabled':''} onclick="buyUp(${i})">${u.bought?'DONE':'BUY'}</button>`;p.appendChild(d)})}if(state.tab==='contracts'){state.contracts.forEach((c,i)=>{const prog=Math.min(c.progress,c.target);const pct=Math.floor(prog/c.target*100);const d=document.createElement('div');d.className='card';let name=c.type==='clicks'?`Hack ${c.target}x`:c.type==='cash'?`Earn $${format(c.target)}`:`Own ${c.target} rigs`;d.innerHTML=`<div><b>CONTRACT ${i+1}</b> ${pct}%<br><span style="font-size:11px">${name} - ${prog}/${c.target}</span><br><span style="color:#ffcc00;font-size:11px">Reward $${format(c.reward)} -5% trace</span></div><button ${prog<c.target?'disabled':''} onclick="claim(${i})">CLAIM</button>`;p.appendChild(d)})}}function claim(i){const c=state.contracts[i];if(c.progress>=c.target){state.cash+=c.reward;state.trace-=5;if(state.trace<0)state.trace=0;state.contracts[i]={type:['clicks','cash','rigs'][Math.floor(Math.random()*3)],target:c.target*2,progress:0,reward:c.reward*2.2};updateUI()}}let vulnTimer;function scheduleVuln(){vulnTimer=setTimeout(()=>{showVuln()},25000+Math.random()*20000)}function showVuln(){const el=document.getElementById('vuln');el.style.display='block';setTimeout(()=>{el.style.display='none';scheduleVuln()},7000)}function hitVuln(){const el=document.getElementById('vuln');el.style.display='none';const b=state.cash*0.15+500;state.cash+=b;state.boostTime=120;log('VULN +$'+format(b)+' 2x 2min');updateUI();scheduleVuln()}document.getElementById('ocBtn').onclick=()=>{if(state.overclockActive||state.overclockCd>0)return;state.overclockActive=true;setTimeout(()=>{state.overclockActive=false;state.overclockCd=60},10000)};setInterval(()=>{const cps=getCPS();state.cash+=cps/10;state.lifetime+=cps/10;if(state.boostTime>0)state.boostTime-=0.1;if(state.overclockCd>0)state.overclockCd-=0.1;if(state.overclockCd<0)state.overclockCd=0;state.contracts.forEach(c=>{if(c.type==='cash')c.progress=state.lifetime;if(c.type==='rigs')c.progress=state.rigs.reduce((a,r)=>a+r.count,0)});updateUI()},100);function updateUI(){document.getElementById('cash').textContent='$'+format(state.cash);document.getElementById('cps').textContent=format(getCPS())+'/s';document.getElementById('trace').textContent=Math.floor(state.trace)+'%';document.getElementById('traceBar').style.width=state.trace+'%';document.getElementById('rep').textContent=state.rep;const pot=Math.floor(Math.sqrt(state.lifetime/1e6));document.getElementById('potential').textContent=pot>0?`RAID NOW -> +${pot} REP`:'';const oc=document.getElementById('ocBtn');if(state.overclockActive){oc.textContent='OVERCLOCK ACTIVE';oc.className='overclock active'}else if(state.overclockCd>0){oc.textContent=`COOLING ${state.overclockCd.toFixed(0)}s`;oc.className='overclock cool'}else{oc.textContent='OVERCLOCK READY [5x 10s]';oc.className='overclock'}document.getElementById('combo').textContent=state.combo>1?`COMBO x${(1+state.combo*0.4).toFixed(1)} (${state.combo})`:'';let rank='Script Kiddie';if(state.cash>1000)rank='Phreaker';if(state.cash>10000)rank='Coder';if(state.cash>100000)rank='Blackhat';if(state.cash>1e6)rank='Ghost';if(state.cash>1e7)rank='Legend';document.getElementById('rank').textContent=rank;render()}setInterval(save,2000);load();updateUI();render();scheduleVuln();log('connected to darknet...');</script></body></html>
