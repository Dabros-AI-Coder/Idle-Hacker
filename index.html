<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>HACKER TYCOON</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="matrix"></canvas>
<main class="main-menu" id="mainMenu">
  <div class="menu-shell">
    <div class="menu-kicker">// SECURE CHANNEL ESTABLISHED</div>
    <h1>HACKER<br><span>TYCOON</span></h1>
    <div class="menu-rule"><span></span> BLACKNET OPERATIONS <span></span></div>
    <p class="menu-copy">Build your rig. Stay invisible.<br>Own the network.</p>
    <button class="start-btn" id="startBtn">START SESSION <span>_</span></button>
    <div class="menu-status" id="menuStatus">NO ACTIVE SESSION FOUND</div>
  </div>
</main>

<div class="game-screen" id="gameScreen" hidden>
<div class="top">
  <div class="cash" id="cash">$0</div>
  <div class="sub">
    <span id="cps">0/s</span>
    <span>TRACE <span id="trace">0%</span></span>
    <span>REP <span id="rep">0</span></span>
    <span class="rank" id="rank">Script Kiddie</span>
    <span id="potential"></span>
  </div>
  <div class="bar-wrap"><div class="bar trace" id="traceBar"></div></div>
</div>

<div class="center">
  <button class="hack-btn" id="hackBtn">HACK</button>
  <div class="combo" id="combo"></div>
  <button class="overclock" id="ocBtn">OVERCLOCK</button>
  <div class="actions">
    <button class="small" onclick="Game.cleanLogs()">CLEAN -$10k</button>
    <button class="small danger" onclick="Game.doRaid()">FBI RAID</button>
  </div>
</div>

<div class="panel" id="panel"></div>
<div class="log" id="log"></div>

<div class="tabs">
  <div class="tab active" data-tab="rigs">RIGS</div>
  <div class="tab" data-tab="contracts">CONTRACTS</div>
  <div class="tab" data-tab="upgrades">UPGRADES</div>
</div>

<div class="vuln" id="vuln">[BUG] VULN FOUND!</div>
</div>

<script type="module">
import { Game } from './js/game.js';
import { UI } from './js/ui.js';
window.Game = Game;
UI.initMatrix();

const hasSave = Boolean(localStorage.getItem('hackerTycoon_modular'));
if(hasSave) document.getElementById('menuStatus').textContent = 'SAVED SESSION DETECTED // READY TO RESUME';
document.getElementById('startBtn').addEventListener('click', ()=>{
  document.getElementById('mainMenu').classList.add('closing');
  document.getElementById('gameScreen').hidden = false;
  Game.init();
  setTimeout(()=> document.getElementById('mainMenu').hidden = true, 280);
});
</script>
</body>
</html>
